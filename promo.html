<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BallotIQ — See who is running</title>
    <meta
      name="description"
      content="BallotIQ is a state map for U.S. elections. Click a state to see who is running, their profile, and where federal campaign money comes from."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/promo.css" />
  </head>
  <body>
    <a class="skip" href="#demo">Skip to the map</a>
    <header class="mast">
      <div class="mast-inner">
        <div class="mast-row">
          <div>
            <p class="eyebrow">A reading guide, not an official ballot</p>
            <h1>BallotIQ</h1>
            <p class="deck">Click a state. See who is running.</p>
          </div>
          <div class="mast-actions">
            <section class="countdown" id="countdown" aria-label="Time until Election Day">
              <p class="countdown-kicker">Election Day</p>
              <p class="countdown-when" data-countdown-when>November 3, 2026</p>
              <div class="countdown-units" data-countdown-units>
                <div><strong data-countdown-days>—</strong><span>Days</span></div>
                <div><strong data-countdown-hours>—</strong><span>Hours</span></div>
                <div><strong data-countdown-minutes>—</strong><span>Minutes</span></div>
                <div><strong data-countdown-seconds>—</strong><span>Seconds</span></div>
              </div>
              <p class="countdown-status" data-countdown-status hidden></p>
            </section>
            <a class="btn btn-solid" href="/">Open the guide</a>
          </div>
        </div>
      </div>
      <div class="flag-rule" aria-hidden="true"></div>
    </header>
    <main id="demo" class="demo">Loading the map…</main>
    <script type="module" src="/src/promo.js"></script>
  </body>
</html>
