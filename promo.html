<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BallotIQ — See who is running</title>
    <meta
      name="description"
      content="BallotIQ is a state map for U.S. elections. Click a state to see who is running, their profile, and where federal campaign money comes from."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/promo.css" />
  </head>
  <body>
    <a class="skip" href="#demo">Skip to the map</a>
    <header class="mast">
      <div class="mast-inner">
        <p class="eyebrow">A reading guide, not an official ballot</p>
        <div class="mast-row">
          <h1>Ballot<span>IQ</span></h1>
          <a class="btn btn-solid" href="/">Open the guide</a>
        </div>
        <p class="deck">Click a state. See who is running.</p>
      </div>
      <div class="flag-rule" aria-hidden="true"></div>
    </header>
    <main id="demo" class="demo">Loading the map…</main>
    <script type="module" src="/src/promo.js"></script>
  </body>
</html>
